<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">i.d favicon</title>
  <desc id="desc">Logo i.d berwarna putih pada latar biru</desc>

  <defs>
    <linearGradient
      id="background"
      x1="8"
      y1="4"
      x2="58"
      y2="60"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#4F80EE
" />
      <stop offset="1" stop-color="#2F5FD3
" />
    </linearGradient>
  </defs>

  <rect
    width="64"
    height="64"
    rx="16"
    fill="url(#background)"
  />

  <text
    x="32"
    y="43"
    text-anchor="middle"
    fill="#FFFFFF
"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-2"
  >i.d</text>
</svg>